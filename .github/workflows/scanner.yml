name: Gold Scanner

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"
      timezone: "America/Argentina/Buenos_Aires"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore macro state
        uses: actions/cache/restore@v4
        with:
          path: .gold_scanner_state.json
          key: gold-scanner-macro-state-${{ github.run_id }}
          restore-keys: |
            gold-scanner-macro-state-

      - name: Run tests
        run: python -m pytest -q

      - name: Run scanner
        run: python -m gold_scanner.main

      - name: Save macro state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .gold_scanner_state.json
          key: gold-scanner-macro-state-${{ github.run_id }}

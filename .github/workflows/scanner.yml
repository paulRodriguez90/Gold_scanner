name: Gold Scanner

on:
  workflow_dispatch:
  schedule:
    # Argentina time (America/Argentina/Buenos_Aires):
    # Mon-Fri 06:30, 12:00, 17:30 + Sunday 17:30. No Saturday runs.
    - cron: "30 6 * * 1-5"
      timezone: "America/Argentina/Buenos_Aires"
    - cron: "0 12 * * 1-5"
      timezone: "America/Argentina/Buenos_Aires"
    - cron: "30 17 * * 0-5"
      timezone: "America/Argentina/Buenos_Aires"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Restore macro state
        uses: actions/cache/restore@v4
        with:
          path: .gold_scanner_state.json
          key: gold-scanner-macro-state-${{ github.run_id }}
          restore-keys: |
            gold-scanner-macro-state-

      - name: Ensure macro state exists
        run: python -c "from gold_scanner.macro_state import load_state, save_state; save_state(load_state())"

      - name: Run tests
        run: python -m pytest -q

      - name: Run scanner and send Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m gold_scanner.main

      - name: Save macro state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .gold_scanner_state.json
          key: gold-scanner-macro-state-${{ github.run_id }}
